name: Publish to npm

# Manual only. Bump `version` in package.json, commit, then run this from the
# Actions tab. Nothing publishes on push.
#
# Uses npm trusted publishing (OIDC) — there is no npm token and no
# NPM_TOKEN secret. Before this can work, the package must exist on npm and a
# trusted publisher must be configured for this repo + workflow filename:
#   npmjs.com -> Packages -> @es11225599/systemone-mcp -> Settings
#   -> Trusted Publisher -> GitHub Actions
#      Organization or user: es11225599
#      Repository:           system-one-mcp
#      Workflow filename:    publish-npm.yml
#
# The first publish after adding the trusted publisher must happen within
# 2 days, or the configuration expires and has to be recreated.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate the package without publishing it to npm"
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  # Required: this is what lets GitHub mint the OIDC token npm exchanges for
  # a short-lived publish token.
  id-token: write

# Never let two publishes race for the same version.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1.
      - name: Upgrade npm
        run: npm install -g npm@latest

      # Locked, reproducible install. Runs `prepare`, which builds dist/.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check version is not already published
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is already on npm. Bump version in package.json first."
            exit 1
          fi
          echo "$NAME@$VERSION is free to publish."

      - name: Dry run
        if: ${{ inputs.dry_run }}
        run: npm publish --access public --dry-run

      # No NODE_AUTH_TOKEN: npm authenticates via OIDC automatically here.
      # Provenance is generated automatically for trusted publishes, so there
      # is no --provenance flag.
      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public
