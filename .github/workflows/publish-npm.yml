name: Publish to npm

# Manual only. Bump `version` in package.json, commit, then run this from the
# Actions tab. Nothing publishes on push.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate the package without publishing it to npm"
        type: boolean
        required: false
        default: true

# Only the token secret and a provenance OIDC token are needed.
permissions:
  contents: read
  id-token: write # npm provenance

# Never let two publishes race for the same version.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Locked, reproducible install. Runs `prepare`, which builds dist/.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check version is not already published
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is already on npm. Bump version in package.json first."
            exit 1
          fi
          echo "$NAME@$VERSION is free to publish."

      - name: Dry run
        if: ${{ inputs.dry_run }}
        run: npm publish --access public --dry-run

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
